name: HotelReservation

on:
  workflow_dispatch:    
  pull_request:
    types: [opened, reopened]
    branches:
      - main

env:
  COMMIT_ID: ${{ github.sha }}

jobs:
  sonarCheck:
    name: SonarQube Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 11
        uses: actions/setup-java@v1
        with:
          java-version: 1.11
      - name: Cache SonarQube packages
        uses: actions/cache@v1
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube scanner
        id: cache-sonar-scanner
        uses: actions/cache@v1
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner
      - name: Setup Nuget
        uses: Nuget/setup-nuget@v1.0.5
      - name: Restore nuget packages
        run: nuget restore ProiectPWeb/ProiectPWeb.sln
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        shell: powershell
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin /k:"TibiAlex_Degree-Project-CSharp_AYgGAesmSaA_My6iI6cM" /d:sonar.login="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}"
          dotnet build ProiectPWeb/ProiectPWeb.sln
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"

  dockerBuildAndPush:
    name: Build docker image and push it to docker hub
    needs: sonarCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: docker login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD

      - name: build image
        run: docker build -f ProiectPWeb/ProiectPWeb/Dockerfile --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:${COMMIT_ID:0:7} --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest  ProiectPWeb/

      - name: push to dockerhub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }} --all-tags

  deployToAKS:
    name: Deploy image to aks
    needs: dockerBuildAndPush
    runs-on: ubuntu-latest
    outputs:
      output1: ${{ steps.set_variable.outputs.service_ip }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
      - name: Azure Login
        uses: Azure/login@v1.4.6
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Setup kubectl
        id: install-kubectl
        uses: azure/setup-kubectl@v3
      - name: Install Helm
        run: |
          curl https://baltocdn.com/helm/signing.asc | sudo apt-key add -
          sudo apt-get install apt-transport-https --yes
          echo "deb https://baltocdn.com/helm/stable/debian/ all main" | sudo tee /etc/apt/sources.list.d/helm-stable-debian.list
          sudo apt-get update
          sudo apt-get install helm --yes
      - name: Deploy to AKS using Helm
        id: set_variable
        run: |
          az aks get-credentials --resource-group ${{ secrets.RESOURCE_GROUP }} --name ${{ secrets.CLUSTER_NAME }}
          kubectl create namespace ${{ secrets.DEV_NAMESPACE }}
          kubectl create secret docker-registry aks-secret --namespace ${{ secrets.DEV_NAMESPACE }} --docker-server=${{ secrets.DOCKER_SERVER }} --docker-username=${{ secrets.DOCKERHUB_USERNAME }} --docker-password=${{ secrets.DOCKERHUB_PASSWORD }} --docker-email=${{ secrets.DOCKERHUB_EMAIL }}
          helm install --namespace=${{ secrets.DEV_NAMESPACE }} degree values-helm --set namespace.name=${{ secrets.DEV_NAMESPACE }} --set image.name=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest --set version.name=${COMMIT_ID:0:7}
          chmod +x sleep_until_condition.sh
          ./sleep_until_condition.sh ${{ secrets.DEV_NAMESPACE }}
          kubectl config set-context --current --namespace=${{ secrets.DEV_NAMESPACE }}
          service_ip=$(kubectl get service degree-csharp -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          service_ip="http://${service_ip}:8080"
          echo "::set-output name=service_ip::${service_ip}"

  karateTests:
    name: Start karate tests
    needs: deployToAKS
    runs-on: ubuntu-latest
    steps:
       - name: Trigger Workflow and Wait
         uses: convictional/trigger-workflow-and-wait@v1.6.5
         with:
           # The owner of the repository where the workflow is contained.
           owner: TibiAlex
           # The repository where the workflow is contained.
           repo: Karate-E2E-testing
           # The Github access token with access to the repository. It is recommended you put this token under secrets.
           github_token: ${{ secrets.G_ACCESS_TOKEN }}
           # The name of the github user whose access token is being used to trigger the workflow.
           github_user: TibiAlex
           # The reference of the workflow run. The reference can be a branch, tag, or a commit SHA. Default: main
           ref: main
           # The number of seconds delay between checking for result of run.
           wait_interval: 10
           # The reference point. For example, you could use main.yml.
           workflow_file_name: build.yaml
           # Payload to pass to the workflow, must be a JSON string
           client_payload: |
             {
               "env": "csharp",
               "baseUrl": "${{ needs.deployToAKS.outputs.output1 }}",
               "path": "customCSharp/CsharpRunner"
             }
           # Fail current job if downstream job fails. default: true
           propagate_failure: true
           # Trigger the specified workflow. default: true
           trigger_workflow: true
           # Wait for workflow to finish. default: true
           wait_workflow: true

  deleteDeployment:
    name: Delete deployment from aks
    needs: karateTests
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: Azure/login@v1.4.6
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Setup kubectl
        id: install-kubectl
        uses: azure/setup-kubectl@v3
      - name: Install Helm
        run: |
          curl https://baltocdn.com/helm/signing.asc | sudo apt-key add -
          sudo apt-get install apt-transport-https --yes
          echo "deb https://baltocdn.com/helm/stable/debian/ all main" | sudo tee /etc/apt/sources.list.d/helm-stable-debian.list
          sudo apt-get update
          sudo apt-get install helm --yes
      - name: Uninstall helm charts
        run: |
          az aks get-credentials --resource-group ${{ secrets.RESOURCE_GROUP }} --name ${{ secrets.CLUSTER_NAME }}
          kubectl config set-context --current --namespace=${{ secrets.DEV_NAMESPACE }}
          helm uninstall degree
          kubectl delete namespace ${{ secrets.DEV_NAMESPACE }}
